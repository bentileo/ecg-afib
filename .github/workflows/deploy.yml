name: Deploy

# Run from the Actions tab. The host filters inbound SSH from CI runners, so
# pushing does not trigger this; deploy from a trusted machine instead.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch the code
      - uses: actions/checkout@v4

      # 2. Open an SSH session to the server using the stored key
      - name: Run the deployment script on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 3. Pull, install, and restart, all handled by the script
          script: bash /opt/ecg-afib/scripts/deploy.sh
