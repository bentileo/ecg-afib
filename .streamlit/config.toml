# Theme and server settings for the ECG screening dashboard.
# The palette is shared with bentileo.tech and the cardiac benchmark dashboard:
# white page, faint panels, hairline rules, Inter for UI, one red for the active state.

[theme]
base = "light"
primaryColor = "#D9372A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#15191D"
linkColor = "#1D4ED8"
font = "sans serif"

[server]
headless = true
# A ten-second ECG is roughly 20 KB. Streamlit's 200 MB default would let a
# single upload exhaust memory, so it is capped at a still-generous 2 MB.
maxUploadSize = 2
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false
